[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remotion-local-render-worker"
version = "0.1.0"
description = "A local Ubuntu worker that renders Remotion video jobs submitted through Google Drive."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.130.0",
  "google-auth>=2.29.0",
  "google-auth-httplib2>=0.2.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.5.0"]

[project.scripts]
render-worker = "render_worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
